    :root {

    /* =====================================================

    #captcha-screen {
      position: fixed;
      inset: 0;

      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(217,138,68,0.10),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #05070a 0%,
          #090b10 50%,
          #050609 100%
        );

      transition:
        opacity 0.65s ease,
        visibility 0.65s ease;
    }

    #captcha-screen::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(255,255,255,0.018) 50%,
          transparent 100%
        );

      pointer-events: none;
    }

    .captcha-wrapper {
      position: relative;

      width: min(440px, 100%);
    }

    .captcha-wrapper::before {
      content: "";

      position: absolute;

      inset: -1px;

      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          rgba(217,138,68,0.40),
          transparent 30%,
          transparent 70%,
          rgba(217,138,68,0.15)
        );

      opacity: 0.65;

      filter: blur(8px);

      pointer-events: none;
    }

    .captcha-box {
      position: relative;

      z-index: 1;

      width: 100%;

      padding: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(24,28,37,0.98),
          rgba(13,16,22,0.98)
        );

      border: 1px solid rgba(255,255,255,0.09);

      border-radius: 22px;

      box-shadow:
        0 30px 80px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.04);

      cursor: pointer;

      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .captcha-box:hover {
      transform: translateY(-3px);

      border-color: rgba(217,138,68,0.45);

      box-shadow:
        0 35px 90px rgba(0,0,0,0.72),
        0 0 35px rgba(217,138,68,0.10);
    }

    .captcha-box:active {
      transform: scale(0.985);
    }

    .captcha-box:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .captcha-top {
      display: flex;
      align-items: center;

      gap: 14px;

      margin-bottom: 22px;
    }

    .captcha-logo {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          rgba(217,138,68,0.22),
          rgba(217,138,68,0.05)
        );

      border: 1px solid rgba(217,138,68,0.20);

      box-shadow:
        0 8px 25px rgba(217,138,68,0.08);
    }

    .captcha-logo svg {
      width: 23px;
      height: 23px;

      fill: none;
      stroke: var(--accent);

      stroke-width: 1.8;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .captcha-heading {
      display: flex;
      flex-direction: column;

      gap: 3px;
    }

    .captcha-title {
      color: var(--text-main);

      font-size: 16px;

      font-weight: 700;
    }

    .captcha-small {
      color: var(--text-muted);

      font-size: 12px;
    }

    .captcha-action {
      display: flex;
      align-items: center;

      gap: 15px;

      padding: 16px;

      background: rgba(255,255,255,0.025);

      border: 1px solid rgba(255,255,255,0.07);

      border-radius: 14px;

      transition:
        background 0.25s ease,
        border-color 0.25s ease;
    }

    .captcha-box:hover .captcha-action {
      background: rgba(217,138,68,0.045);

      border-color: rgba(217,138,68,0.15);
    }

    .checkbox {
      position: relative;

      width: 30px;
      height: 30px;

      flex: 0 0 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,255,255,0.02);

      border: 2px solid #69717d;

      border-radius: 8px;

      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
    }

    .checkbox.loading {
      border-color: var(--accent);

      box-shadow:
        0 0 18px rgba(217,138,68,0.16);
    }

    .checkbox.success {
      background: rgba(63,185,80,0.10);

      border-color: var(--success);

      box-shadow:
        0 0 18px rgba(63,185,80,0.15);
    }

    .check-icon {
      width: 17px;
      height: 17px;

      opacity: 0;

      transform: scale(0.5);

      fill: var(--success);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .checkbox.success .check-icon {
      opacity: 1;

      transform: scale(1);
    }

    .captcha-message {
      display: flex;
      flex-direction: column;

      gap: 3px;

      min-width: 0;
    }

    .captcha-main-text {
      color: var(--text-main);

      font-size: 14px;

      font-weight: 600;

      transition: color 0.25s ease;
    }

    .captcha-status {
      color: var(--text-muted);

      font-size: 11px;

      transition: color 0.25s ease;
    }

    .captcha-progress {
      width: 100%;

      height: 3px;

      margin-top: 16px;

      overflow: hidden;

      background: rgba(255,255,255,0.05);

      border-radius: 10px;

      opacity: 0;

      transition: opacity 0.3s ease;
    }

    .captcha-progress.active {
      opacity: 1;
    }

    .captcha-progress-bar {
      width: 0;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--accent),
          var(--accent-light)
        );

      border-radius: inherit;

      transition: width 0.6s ease;
    }

    .captcha-footer {
      margin-top: 15px;

      text-align: center;

      color: #68717c;

      font-size: 10px;

      letter-spacing: 0.2px;
    }

    .spinner {
      width: 17px;
      height: 17px;

      display: none;

      border: 2px solid rgba(255,255,255,0.10);

      border-top-color: var(--accent);
      border-right-color: var(--accent);

      border-radius: 50%;

      animation:
        captchaSpin 0.75s linear infinite;
    }

    .checkbox.loading .spinner {
      display: block;
    }

    @keyframes captchaSpin {
      to {
        transform: rotate(360deg);
      }
    }

    #app-screen {

    .app-card {

      justify-content: flex-end;

    .menu-container {
      position: relative;
    }

    .menu-btn {
      background: rgba(0,0,0,0.5);

      border: 1px solid rgba(255,255,255,0.2);

      color: white;

      width: 36px;
      height: 36px;

      border-radius: 50%;

      font-size: 20px;

      transition: 0.3s;
    }

    .menu-btn:hover {
      background: rgba(0,0,0,0.8);

      border-color: var(--accent);
    }

    .menu-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .dropdown {
      position: absolute;

      top: 45px;
      right: 0;

      background: var(--bg-card);

      border: 1px solid var(--border);

      border-radius: 10px;

      width: 200px;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.5);

      opacity: 0;

      visibility: hidden;

      transform: translateY(-10px);

      transition: all 0.3s ease;

      z-index: 10;

      overflow: hidden;
    }

    .dropdown.active {
      opacity: 1;

      visibility: visible;

      transform: translateY(0);
    }

    .dropdown button {
      width: 100%;

      background: none;

      border: none;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 14px 18px;

      color: var(--text-main);

      font-size: 14px;

      transition: 0.2s;

      cursor: pointer;
    }

    .dropdown button:hover {
      background: var(--bg-hover);

      color: var(--accent);
    }

    .menu-icon {
      width: 18px;
      height: 18px;

      stroke: currentColor;

      fill: none;

      stroke-width: 2;

      stroke-linecap: round;

    .app-body {

    }

    .server-badge {

    .online-dot {

        0 0 8px var(--success);

    }

    .desc-box {
      background: var(--bg-deep);

      padding: 20px;

      border-radius: 12px;

      border: 1px solid var(--border);

      font-size: 14px;

      line-height: 1.7;

      color: var(--text-muted);

      margin-bottom: 25px;
    }

    .desc-box strong {
      color: var(--text-main);
    }

    .btn-join {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 16px;

      background: var(--accent);

      color: #000;

      font-weight: 600;

    .btn-join:hover {

    }

    .btn-join:focus-visible {
      outline: 2px solid var(--accent-light);

      outline-offset: 3px;
    }

    .creator-tag {
      text-align: center;

      margin-top: 20px;

      font-size: 12px;

      color: var(--text-muted);
    }

    .creator-tag span {
      color: var(--accent);

    }


    /* =====================================================
       MODAL DE REGRAS
    ===================================================== */

    #rules-modal {

      inset: 0;

      background: rgba(0,0,0,0.8);

      backdrop-filter: blur(8px);

      z-index: 2000;

      display: flex;

      align-items: center;
      justify-content: center;

      opacity: 0;

      visibility: hidden;

      transition: all 0.3s ease;

    }

    #rules-modal.active {
      opacity: 1;

      visibility: visible;
    }

    .modal-content {
      background: var(--bg-card);

      border: 1px solid var(--border);

      width: min(600px,100%);

      max-height: 85vh;

      border-radius: 16px;

      display: flex;

      flex-direction: column;

      overflow: hidden;

      box-shadow:
        0 25px 50px rgba(0,0,0,0.8);

      transform: translateY(20px);

      transition: transform 0.3s ease;
    }

    #rules-modal.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      padding: 20px 24px;

      border-bottom: 1px solid var(--border);

      display: flex;

      align-items: center;

      justify-content: space-between;

      background: var(--bg-deep);
    }

    .modal-header h2 {
      font-size: 18px;

      color: var(--accent);

      display: flex;

      align-items: center;

      gap: 10px;
    }

    .close-modal {
      background: none;

      border: none;

      color: var(--text-muted);

      font-size: 24px;

      cursor: pointer;

      transition: 0.2s;

      line-height: 1;
    }

    .close-modal:hover {
      color: var(--text-main);
    }

    .modal-body {
      padding: 24px;

      overflow-y: auto;

      display: flex;

      flex-direction: column;

      gap: 20px;
    }

    .rules-intro {
      font-size: 13px;

      color: var(--text-muted);

      background: var(--bg-deep);

      padding: 16px;

      border-radius: 8px;

      border-left: 3px solid var(--accent);

      line-height: 1.6;
    }

    .rule-item {
      background: var(--bg-deep);

      padding: 14px 16px;

      border-radius: 8px;

      border: 1px solid var(--border);
    }

    .rule-title {
      font-weight: 600;

      color: var(--text-main);

      font-size: 14px;

      display: flex;

      align-items: center;

      gap: 8px;
    }

    .custom-rule-icon {
      width: 14px;
      height: 14px;

      fill: var(--accent);

      flex-shrink: 0;
    }

    .rule-desc {
      font-size: 13px;

      color: var(--text-muted);

      margin-bottom: 8px;

      line-height: 1.5;
    }

    .rule-punish {
      font-size: 11px;

      color: var(--accent);

      background: rgba(217,138,68,0.1);

      padding: 4px 8px;

      border-radius: 4px;

      display: inline-block;

      text-transform: lowercase;

      letter-spacing: 0.5px;
    }


    /* =====================================================
       RESPONSIVO
    ===================================================== */

    @media (max-width: 480px) {

      #captcha-screen {
        padding: 15px;
      }

      .captcha-box {
        padding: 21px;

        border-radius: 19px;
      }

      .captcha-top {
        margin-bottom: 18px;
      }

      .captcha-action {
        padding: 14px;
      }

      .captcha-title {
        font-size: 15px;
      }

      .captcha-main-text {
        font-size: 13px;
      }

      .app-body {
        padding: 0 20px 25px;
      }

      .modal-body {
        padding: 18px;
      }
    }
