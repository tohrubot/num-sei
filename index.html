<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nekōya | Brokeback Mountain</title>

  <meta
    name="description"
    content="Nekōya sfw — uma comunidade para interação, amizades, artes e muito mais."
  >

  <meta name="theme-color" content="#07090c">

  <meta property="og:title" content="Nekōya | Brokeback Mountain">
  <meta
    property="og:description"
    content="Entre na Nekōya sfw e faça parte do Vale."
  >
  <meta property="og:type" content="website">

  <style>
    :root{
      --bg-deep:#07090c;
      --bg-card:#12151c;
      --bg-hover:#1a1e27;
      --accent:#d98a44;
      --accent-light:#efad6f;
      --accent-glow:rgba(217,138,68,.28);
      --text-main:#f0f2f5;
      --text-muted:#8b949e;
      --border:rgba(255,255,255,.08);
      --success:#3fb950;
      --danger:#e5534b;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      font-family:
        "Outfit",
        Arial,
        Helvetica,
        sans-serif;
      color:var(--text-main);
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(217,138,68,.08),
          transparent 35%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(217,138,68,.05),
          transparent 30%
        ),
        var(--bg-deep);
      overflow-x:hidden;
    }

    body.locked{
      overflow:hidden;
    }

    a{
      color:inherit;
    }

    button,
    a{
      -webkit-tap-highlight-color:transparent;
    }

    /* =====================================================
       FUNDO
    ===================================================== */

    .page-bg{
      position:fixed;
      inset:0;
      z-index:-10;
      pointer-events:none;
      overflow:hidden;
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(217,138,68,.07),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(217,138,68,.06),
          transparent 30%
        );
    }

    .page-bg::before,
    .page-bg::after{
      content:"";
      position:absolute;
      border-radius:50%;
      filter:blur(100px);
    }

    .page-bg::before{
      width:350px;
      height:350px;
      top:-160px;
      left:-150px;
      background:rgba(217,138,68,.09);
    }

    .page-bg::after{
      width:320px;
      height:320px;
      right:-140px;
      bottom:-160px;
      background:rgba(217,138,68,.07);
    }

    /* =====================================================
       VERIFICAÇÃO
    ===================================================== */

    .verification-screen{
      position:fixed;
      inset:0;
      z-index:99999;

      display:flex;
      align-items:center;
      justify-content:center;

      width:100%;
      min-height:100dvh;

      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(217,138,68,.14),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(217,138,68,.07),
          transparent 40%
        ),
        rgba(5,7,9,.98);

      transition:
        opacity .55s ease,
        visibility .55s ease;
    }

    .verification-screen.is-hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .verify-card{
      position:relative;
      width:min(430px,100%);

      padding:32px 24px 24px;

      border:1px solid rgba(255,255,255,.09);
      border-radius:28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.025)
        );

      box-shadow:
        0 30px 90px rgba(0,0,0,.6),
        0 0 60px rgba(217,138,68,.07);

      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);

      text-align:center;

      overflow:hidden;

      transform:
        translateY(0)
        scale(1);

      transition:
        transform .35s ease;
    }

    .verify-card::before{
      content:"";
      position:absolute;
      left:18%;
      top:-80px;

      width:64%;
      height:160px;

      border-radius:50%;

      background:rgba(217,138,68,.08);

      filter:blur(45px);
      pointer-events:none;
    }

    .verify-brand{
      position:relative;
      z-index:2;

      display:inline-flex;
      align-items:center;
      justify-content:center;

      width:48px;
      height:48px;

      margin-bottom:16px;

      border:1px solid rgba(217,138,68,.28);
      border-radius:16px;

      background:
        linear-gradient(
          145deg,
          rgba(217,138,68,.17),
          rgba(217,138,68,.04)
        );

      color:var(--accent-light);

      box-shadow:
        0 0 28px rgba(217,138,68,.10);
    }

    .verify-brand svg{
      width:23px;
      height:23px;
    }

    .verify-kicker{
      position:relative;
      z-index:2;

      margin-bottom:9px;

      color:var(--accent-light);

      font-size:10px;
      font-weight:800;
      letter-spacing:2.4px;
      text-transform:uppercase;
    }

    .verify-title{
      position:relative;
      z-index:2;

      margin-bottom:10px;

      font-size:30px;
      line-height:1.12;
      letter-spacing:-1px;
    }

    .verify-description{
      position:relative;
      z-index:2;

      max-width:340px;
      margin:0 auto 22px;

      color:var(--text-muted);

      font-size:13px;
      line-height:1.7;
    }

    .verify-action{
      position:relative;
      z-index:2;

      width:100%;
      min-height:54px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      padding:15px 18px;

      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #ad6933
        );

      color:#fff;

      font:inherit;
      font-size:14px;
      font-weight:800;

      cursor:pointer;

      box-shadow:
        0 14px 35px
        rgba(217,138,68,.20);

      transition:
        transform .22s ease,
        box-shadow .22s ease,
        filter .22s ease,
        opacity .22s ease;
    }

    .verify-action:hover{
      transform:translateY(-2px);
      box-shadow:
        0 17px 40px
        rgba(217,138,68,.30);
      filter:brightness(1.05);
    }

    .verify-action:active{
      transform:scale(.985);
    }

    .verify-action:disabled{
      cursor:default;
      opacity:.9;
    }

    .verify-action-icon{
      width:18px;
      height:18px;
      display:block;
      flex:none;
    }

    .verify-status{
      display:none;

      position:relative;
      z-index:2;

      min-height:110px;

      align-items:center;
      justify-content:center;
      flex-direction:column;
    }

    .verification-screen.loading .verify-start{
      display:none;
    }

    .verification-screen.loading .verify-status{
      display:flex;
    }

    .status-ring{
      width:42px;
      height:42px;

      margin-bottom:14px;

      border-radius:50%;

      border:4px solid rgba(255,255,255,.10);
      border-top-color:var(--accent);

      animation:spin .8s linear infinite;
    }

    .status-title{
      margin-bottom:4px;

      color:#fff;

      font-size:15px;
      font-weight:800;
    }

    .status-text{
      color:#777f87;
      font-size:12px;
    }

    .success-mark{
      display:none;

      width:48px;
      height:48px;

      margin-bottom:12px;

      align-items:center;
      justify-content:center;

      border-radius:50%;

      border:1px solid rgba(63,185,80,.35);

      background:
        rgba(63,185,80,.10);

      color:var(--success);

      animation:
        successPop .35s ease;
    }

    .success-mark svg{
      width:23px;
      height:23px;
    }

    .verification-screen.success .status-ring{
      display:none;
    }

    .verification-screen.success .success-mark{
      display:flex;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    @keyframes successPop{
      0%{
        transform:scale(.7);
        opacity:0;
      }

      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    /* =====================================================
       APP
    ===================================================== */

    #app{
      min-height:100vh;
      opacity:0;
      pointer-events:none;

      transition:
        opacity .55s ease;
    }

    #app.ready{
      opacity:1;
      pointer-events:auto;
    }

    .container{
      width:min(450px,95%);
      margin:0 auto;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    header{
      padding-top:24px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:12px 14px;

      border:1px solid var(--border);
      border-radius:18px;

      background:
        rgba(18,21,28,.75);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.25);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .brand-mark{
      width:34px;
      height:34px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:11px;

      color:var(--accent-light);

      background:
        rgba(217,138,68,.10);

      border:1px solid
        rgba(217,138,68,.20);
    }

    .brand-mark svg{
      width:18px;
      height:18px;
    }

    .brand-text{
      font-size:14px;
      font-weight:700;
    }

    .menu-container{
      position:relative;
    }

    .menu-button{
      width:38px;
      height:38px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid var(--border);
      border-radius:12px;

      color:#c4c9cf;
      background:rgba(255,255,255,.035);

      cursor:pointer;
    }

    .menu-button svg{
      width:18px;
      height:18px;
    }

    .dropdown-menu{
      position:absolute;
      top:48px;
      right:0;

      width:180px;

      padding:7px;

      border:1px solid var(--border);
      border-radius:16px;

      background:
        rgba(18,21,28,.96);

      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);

      box-shadow:
        0 18px 50px rgba(0,0,0,.35);

      opacity:0;
      visibility:hidden;
      transform:translateY(-6px);

      transition:
        opacity .2s ease,
        visibility .2s ease,
        transform .2s ease;
    }

    .dropdown-menu.active{
      opacity:1;
      visibility:visible;
      transform:translateY(0);
    }

    .dropdown-menu button{
      width:100%;

      display:flex;
      align-items:center;
      gap:9px;

      padding:11px 12px;

      border:0;
      border-radius:11px;

      background:transparent;
      color:#c9cdd2;

      font:inherit;
      font-size:13px;
      text-align:left;

      cursor:pointer;
    }

    .dropdown-menu button:hover{
      background:rgba(255,255,255,.05);
      color:#fff;
    }

    .dropdown-menu svg{
      width:16px;
      height:16px;
      flex:none;
    }

    /* =====================================================
       CARD PRINCIPAL
    ===================================================== */

    .server-card{
      margin-top:18px;

      padding:16px;

      border:1px solid var(--border);
      border-radius:24px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.25);
    }

    .server-cover{
      position:relative;

      height:190px;

      border-radius:18px;

      overflow:hidden;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.05),
          rgba(0,0,0,.62)
        ),
        url("https://images.unsplash.com/photo-1542332213-9b5a5a3fad35?auto=format&fit=crop&q=80&w=900")
        center/cover no-repeat;
    }

    .server-cover::after{
      content:"";

      position:absolute;
      inset:0;

      background:
        linear-gradient(
          to top,
          rgba(5,7,9,.88),
          transparent 58%
        );
    }

    .server-info{
      padding:20px 6px 4px;
    }

    .server-badge{
      display:inline-flex;
      align-items:center;

      padding:7px 10px;

      margin-bottom:10px;

      border-radius:999px;

      border:1px solid
        rgba(217,138,68,.22);

      background:
        rgba(217,138,68,.08);

      color:var(--accent-light);

      font-size:10px;
      font-weight:800;
      letter-spacing:1.3px;
      text-transform:uppercase;
    }

    .server-title{
      margin-bottom:7px;

      font-size:31px;
      line-height:1.05;
      letter-spacing:-1.3px;
    }

    .server-members{
      margin-bottom:17px;

      color:var(--accent-light);

      font-size:12px;
      font-weight:600;
    }

    .server-description{
      color:var(--text-muted);

      font-size:13px;
      line-height:1.75;
    }

    .join-button{
      width:100%;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;

      margin-top:20px;

      padding:14px 16px;

      border-radius:15px;

      text-decoration:none;

      color:#fff;

      font-size:13px;
      font-weight:800;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #a76130
        );

      box-shadow:
        0 12px 30px
        rgba(217,138,68,.18);

      transition:
        transform .22s ease,
        box-shadow .22s ease;
    }

    .join-button:hover{
      transform:translateY(-2px);

      box-shadow:
        0 16px 36px
        rgba(217,138,68,.28);
    }

    .join-button svg{
      width:17px;
      height:17px;
    }

    .creator{
      margin-top:11px;

      color:#686f77;

      text-align:center;

      font-size:10px;
    }

    .creator strong{
      color:#9ca2a8;
      font-weight:600;
    }

    /* =====================================================
       MODAL
    ===================================================== */

    .modal{
      position:fixed;
      inset:0;

      z-index:5000;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:18px;

      background:
        rgba(0,0,0,.75);

      backdrop-filter:blur(9px);
      -webkit-backdrop-filter:blur(9px);

      opacity:0;
      visibility:hidden;
      pointer-events:none;

      transition:
        opacity .25s ease,
        visibility .25s ease;
    }

    .modal.active{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .modal-card{
      width:min(450px,100%);
      max-height:min(80vh,680px);

      display:flex;
      flex-direction:column;

      border:
        1px solid
        rgba(255,255,255,.09);

      border-radius:24px;

      background:
        linear-gradient(
          145deg,
          rgba(18,21,28,.98),
          rgba(11,13,18,.98)
        );

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.55);

      transform:
        translateY(12px)
        scale(.98);

      transition:
        transform .25s ease;
    }

    .modal.active .modal-card{
      transform:
        translateY(0)
        scale(1);
    }

    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:18px 18px 15px;

      border-bottom:
        1px solid var(--border);
    }

    .modal-title{
      font-size:18px;
      font-weight:800;
    }

    .close-button{
      width:36px;
      height:36px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid var(--border);
      border-radius:11px;

      background:rgba(255,255,255,.035);
      color:#b8bec5;

      cursor:pointer;
    }

    .close-button:hover{
      color:#fff;
      background:rgba(255,255,255,.07);
    }

    .close-button svg{
      width:17px;
      height:17px;
    }

    .rules-content{
      overflow:auto;

      padding:16px 18px 20px;
    }

    .rule{
      padding:14px 0;

      border-bottom:
        1px solid
        rgba(255,255,255,.06);
    }

    .rule:last-child{
      border-bottom:0;
    }

    .rule-top{
      display:flex;
      align-items:flex-start;
      gap:10px;
    }

    .rule-number{
      flex:none;

      width:27px;
      height:27px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:9px;

      background:
        rgba(217,138,68,.10);

      border:
        1px solid
        rgba(217,138,68,.16);

      color:var(--accent-light);

      font-size:10px;
      font-weight:800;
    }

    .rule h3{
      margin-top:1px;
      margin-bottom:5px;

      font-size:13px;

      text-transform:lowercase;
    }

    .rule p{
      color:var(--text-muted);

      font-size:12px;
      line-height:1.65;
    }

    .punishment{
      margin-top:7px;

      color:#a9afb5;

      font-size:10px;
    }

    .punishment strong{
      color:var(--accent-light);
    }

    /* =====================================================
       RODAPÉ
    ===================================================== */

    footer{
      padding:
        25px 0
        45px;

      text-align:center;
    }

    footer p{
      color:#5f666d;
      font-size:10px;
      line-height:1.6;
    }

    /* =====================================================
       RESPONSIVO
    ===================================================== */

    @media (max-width:480px){

      .container{
        width:min(94%,450px);
      }

      .verification-screen{
        padding:
          14px
          14px
          max(14px, env(safe-area-inset-bottom));
      }

      .verify-card{
        padding:28px 18px 18px;
        border-radius:24px;
      }

      .verify-title{
        font-size:27px;
      }

      .verify-description{
        font-size:12.5px;
        margin-bottom:19px;
      }

      .server-cover{
        height:165px;
      }

      .server-title{
        font-size:28px;
      }

      .modal{
        padding:12px;
      }

      .modal-card{
        max-height:86vh;
      }
    }

    @media (prefers-reduced-motion:reduce){

      *,
      *::before,
      *::after{
        scroll-behavior:auto !important;
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>

<body class="locked">

  <div class="page-bg"></div>

  <!-- =====================================================
       VERIFICAÇÃO
  ====================================================== -->

  <section
    class="verification-screen"
    id="verification-screen"
    aria-label="Verificação de segurança"
  >
    <div class="verify-card">

      <div class="verify-start">

        <div class="verify-brand" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 3L19 6V11.5C19 16.2 16.1 19.8 12 21C7.9 19.8 5 16.2 5 11.5V6L12 3Z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
            />
            <path
              d="M9 12L11 14L15 10"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <div class="verify-kicker">
          Nekōya security
        </div>

        <h1 class="verify-title">
          Verificação de segurança
        </h1>
